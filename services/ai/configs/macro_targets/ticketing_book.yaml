name: "ticketing_book"
url: "http://localhost:8000/"

# 데모 사이트 티켓팅 전체 플로우 자동 실행
# index → seat → checkout → done
#
# 좌표 계측 방법:
# 1. `cd services/ai/demo/demo-api && uvicorn main:app --port 8000`
# 2. 브라우저 고정 크기로 http://localhost:8000/ 접속 (권장: 1280x720 viewport)
# 3. `python automouse.py` 실행 → 탭2 시퀀스 매크로의 "좌표 캡처" 버튼으로 각 요소 좌표 수집
# 4. 아래 TODO 로 표시된 좌표를 실측 값으로 교체
#
# 주의:
#  - pyautogui_lv1/lv2 는 url 을 직접 navigate 하지 않음 → 사용자가 브라우저 먼저 열어둔 상태에서 실행
#  - 매진 좌석 = {A3, A4, B5, C1, C7, D2, E8, E7, B1} → 선택 금지
#  - 페이지 전환 대기 시간 확보 위해 configs/macro.yaml 의 lv1.interval 을 1.5~2.0s 로 조정 권장

actions:
  # === index.html — 공연 선택 ===
  - type: "click"
    selector: "#book-E001"
    coords: [0, 0]   # TODO: book-E001 (예: "봄밤의 재즈 콘서트") 실측 좌표 입력

  # === seat.html — 좌석 선택 (예시: B3, B4) ===
  - type: "click"
    selector: "#seat-B3"
    coords: [0, 0]   # TODO: seat-B3 좌표
  - type: "click"
    selector: "#seat-B4"
    coords: [0, 0]   # TODO: seat-B4 좌표
  - type: "click"
    selector: "#btn-next"
    coords: [0, 0]   # TODO: btn-next 좌표

  # === checkout.html — 결제 ===
  - type: "click"
    selector: "#pay-card"
    coords: [0, 0]   # TODO: pay-card (신용/체크 카드) 좌표
  - type: "click"
    selector: "#agree-1"
    coords: [0, 0]   # TODO: agree-1 체크박스 좌표 (label 이 아닌 input 자체 좌표 권장)
  - type: "click"
    selector: "#agree-2"
    coords: [0, 0]   # TODO: agree-2 체크박스 좌표
  - type: "click"
    selector: "#btn-pay"
    coords: [0, 0]   # TODO: btn-pay 좌표

  # === done.html — 홈으로 (선택: 세션 끝내기) ===
  - type: "click"
    selector: "#btn-home"
    coords: [0, 0]   # TODO: btn-home 좌표
