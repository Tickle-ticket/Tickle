# Paths are resolved relative to `ai_root`.
# When ai_root is omitted, it defaults to services/ai.
ai_root: .

paths:
  model_path: train/model_joblib/randomforest_28_g_v1/model.joblib
  meta_path: train/model_joblib/randomforest_28_g_v1/meta.json
  data_dir: data/data_c1
  # JSONL 평가용 입력 (run_performance_test_jsonl.py에서 사용)
  # - 파일(.jsonl) 또는 폴더 경로 가능
  # - CLI에서 --data를 주면 그게 우선
  jsonl_path: C:\Users\SSAFY\Desktop\ws\free\develop-ai\S14P31A203\services\ai\data\data_0515_1000_pred\data_0515_1000.jsonl
evaluation:
  glob: "**/trial_*.json"
  threshold: 0.8
  # score_by_type.png에서 결측치(=imputer로 채워진 비율)가 높은 샘플을 별도 색(보라색)으로 표시하는 기준
  # 예: 0.2면 feature 34개 중 약 7개 이상 NaN이면 보라색으로 표시
  missing_heavy_threshold: 0.2
  include_unlabeled: false

outputs:
  metrics_json: test/outputs/randomforest_28_g_v1/metrics.json
  predictions_jsonl: test/ouputs/randomforest_28_g_v1/predictions.jsonl
  visualizations_dir: test/outputs/randomforest_28_g_v1/plots
