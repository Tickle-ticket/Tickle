<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>TicketDemo - 공연 목록</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TicketDemo</h1>
        <div class="sub">매크로 탐지 연구용 티켓팅 데모 · Step 1/4 공연 선택</div>
    </header>
    <div class="container">
        <h2>예매 가능한 공연</h2>
        <div class="event-list" id="event-list">
            <div class="event-item" data-event-id="E001">
                <h4>봄밤의 재즈 콘서트</h4>
                <div class="meta">2026-05-10 (토) 19:00 · 세종문화회관</div>
                <div class="price">₩ 55,000</div>
                <a href="mock_pages/seat.html?eid=E001" class="btn" id="book-E001">예매하기</a>
            </div>
            <div class="event-item" data-event-id="E002">
                <h4>클래식 오케스트라 정기 공연</h4>
                <div class="meta">2026-05-17 (토) 18:00 · 예술의전당</div>
                <div class="price">₩ 80,000</div>
                <a href="mock_pages/seat.html?eid=E002" class="btn" id="book-E002">예매하기</a>
            </div>
            <div class="event-item" data-event-id="E003">
                <h4>뮤지컬 &lt;오페라의 유령&gt;</h4>
                <div class="meta">2026-05-25 (일) 15:00 · 블루스퀘어</div>
                <div class="price">₩ 120,000</div>
                <a href="mock_pages/seat.html?eid=E003" class="btn" id="book-E003">예매하기</a>
            </div>
            <div class="event-item" data-event-id="E004">
                <h4>인디밴드 합동 공연 (매진)</h4>
                <div class="meta">2026-05-30 (금) 20:00 · KT&amp;G 상상마당</div>
                <div class="price">₩ 35,000</div>
                <button class="btn disabled" id="book-E004" disabled>매진</button>
            </div>
        </div>
    </div>
    <script src="event_logger.js"></script>
    <script src="app.js"></script>
</body>
</html>
