<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>TicketDemo - 좌석 선택</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <script src="../event_logger.js"></script>
    <script src="../app.js"></script>
    <header>
        <h1>TicketDemo</h1>
        <div class="sub">Step 2/4 좌석 선택 <span id="event-title"></span></div>
    </header>
    <div class="container">
        <h2>좌석을 선택하세요 (최대 4석)</h2>
        <div class="notice">회색은 매진, 파란색은 선택한 좌석입니다. 좌석을 다시 클릭하면 선택이 해제됩니다.</div>
        <div class="stage">STAGE</div>
        <div class="seat-grid" id="seat-grid"></div>
        <div class="seat-legend">
            <span class="lg-avail">선택 가능</span>
            <span class="lg-sel">선택됨</span>
            <span class="lg-sold">매진</span>
        </div>
        <div class="card">
            <p>선택한 좌석: <strong id="selected-list">없음</strong></p>
            <p>합계: <strong id="total-price">₩ 0</strong></p>
        </div>
        <div class="actions">
            <a href="../index.html" class="btn btn-secondary" id="btn-back">← 공연 목록</a>
            <button class="btn disabled" id="btn-next" disabled>다음 →</button>
        </div>
    </div>
    <script>
        const EVENTS = {
            'E001': { title: '봄밤의 재즈 콘서트', price: 55000 },
            'E002': { title: '클래식 오케스트라 정기 공연', price: 80000 },
            'E003': { title: '뮤지컬 <오페라의 유령>', price: 120000 }
        };
        const params = new URLSearchParams(location.search);
        const eid = params.get('eid') || 'E001';
        const evt = EVENTS[eid] || EVENTS['E001'];
        document.getElementById('event-title').textContent = '· ' + evt.title;

        const ROWS = 'ABCDE';
        const COLS = 8;
        const soldSeats = new Set(['A3','A4','B5','C1','C7','D2','E8','E7','B1']);
        const grid = document.getElementById('seat-grid');
        for (let r = 0; r < ROWS.length; r++) {
            for (let c = 1; c <= COLS; c++) {
                const id = ROWS[r] + c;
                const div = document.createElement('div');
                div.className = 'seat';
                div.textContent = id;
                div.dataset.seatId = id;
                div.id = 'seat-' + id;
                if (soldSeats.has(id)) div.classList.add('sold');
                grid.appendChild(div);
            }
        }

        const MAX = 4;
        const selected = new Set();
        const selectedListEl = document.getElementById('selected-list');
        const totalEl = document.getElementById('total-price');
        const nextBtn = document.getElementById('btn-next');

        grid.addEventListener('click', (e) => {
            const seat = e.target.closest('.seat');
            if (!seat || seat.classList.contains('sold')) return;
            const id = seat.dataset.seatId;
            if (selected.has(id)) {
                selected.delete(id);
                seat.classList.remove('selected');
            } else {
                if (selected.size >= MAX) return;
                selected.add(id);
                seat.classList.add('selected');
            }
            updateSummary();
        });

        function updateSummary() {
            const arr = Array.from(selected).sort();
            selectedListEl.textContent = arr.length ? arr.join(', ') : '없음';
            const total = arr.length * evt.price;
            totalEl.textContent = '₩ ' + total.toLocaleString();
            if (arr.length > 0) {
                nextBtn.classList.remove('disabled');
                nextBtn.disabled = false;
            } else {
                nextBtn.classList.add('disabled');
                nextBtn.disabled = true;
            }
        }

        nextBtn.addEventListener('click', () => {
            if (selected.size === 0) return;
            const state = { eid, seats: Array.from(selected).sort(), price: evt.price, title: evt.title };
            localStorage.setItem('ticket_booking', JSON.stringify(state));
            location.href = 'checkout.html';
        });
    </script>
</body>
</html>
