# Paths are resolved relative to `ai_root`.
# When ai_root is omitted, it defaults to services/ai.
ai_root: .

paths:
  # Folder input (trial_*.json root folder)
  # data_dir: data/data_tickle_0515_human
  data_dir: ""

  # JSONL input (use this instead of data_dir when evaluating jsonl)
  # - file:  C:\...\something.jsonl
  # - folder: C:\...\jsonl_dir  (then set evaluation.glob to "**/*.jsonl")
  jsonl_path: C:\Users\SSAFY\Desktop\ws\free\develop-ai\S14P31A203\services\ai\data\tickle_0518\tickle_0518.jsonl
evaluation:
  # for data_dir: "**/trial_*.json"
  # for jsonl_path: "**/*.jsonl"
  glob: "**/*.jsonl"
  threshold: 0.5
  include_unlabeled: false
  missing_heavy_threshold: 0.2

ensemble:
  # One entry per type. `type` is matched against trial.summary.type / trial.type (case-insensitive).
  types:
    - type: BOOKING
      aggregation: weighted_mean
      threshold: 0.75
      models:
        - name: booking_logistic
          model_path: train/model_joblib/logistic_30_v3/booking/model.joblib
          weight: 1.0
        - name: booking_random_forest
          model_path: train/model_joblib/randomforest_30_v3/booking/model.joblib
          weight: 1.0
        - name: booking_light_gbm
          model_path: train/model_joblib/lightgbm_30_v3/booking/model.joblib
          weight: 1.0
        # - name: booking_rf
        #   model_path: train/model_joblib/randomforest_30_v2/model.joblib
        #   meta_path: train/model_joblib/randomforest_30_v2/meta.json
        #   weight: 1.0
    - type: CAPTCHA
      aggregation: weighted_mean
      threshold: 0.6
      models:
        - name: booking_logistic
          model_path: train/model_joblib/logistic_30_v3/captcha/model.joblib
          weight: 1.0
        - name: booking_random_forest
          model_path: train/model_joblib/randomforest_30_v3/captcha/model.joblib
          weight: 1.0
        - name: booking_light_gbm
          model_path: train/model_joblib/lightgbm_30_v3/captcha/model.joblib
          weight: 1.0
    - type: DETAIL
      aggregation: weighted_mean
      threshold: 0.50
      models:
        - name: booking_logistic
          model_path: train/model_joblib/logistic_30_v3/detail/model.joblib
          weight: 1.0
        - name: booking_random_forest
          model_path: train/model_joblib/randomforest_30_v3/detail/model.joblib
          weight: 1.0
        - name: booking_light_gbm
          model_path: train/model_joblib/lightgbm_30_v3/detail/model.joblib
          weight: 1.0

outputs:
  metrics_json: test_ensemble/outputs/tickle_0518/metrics.json
  predictions_jsonl: test_ensemble/outputs/tickle_0518/predictions.jsonl
  visualizations_dir: test_ensemble/outputs/tickle_0518/plots
