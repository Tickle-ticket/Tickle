services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tickle-ai-zookeeper
    restart: unless-stopped
    mem_limit: 400m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - tickle-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tickle-ai-kafka
    restart: unless-stopped
    mem_limit: 1024m
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_HEAP_OPTS: "-Xmx768m -Xms256m"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES}

      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      KAFKA_MESSAGE_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES}
      KAFKA_REPLICA_FETCH_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tickle-net

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tickle-ai-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic ${KAFKA_TOPIC_BEHAVIOR_EVENTS}
      --partitions ${KAFKA_TOPIC_BEHAVIOR_EVENTS_PARTITIONS}
      --replication-factor 1
      &&
      kafka-topics --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic ${KAFKA_TOPIC_DLQ}
      --partitions ${KAFKA_TOPIC_DLQ_PARTITIONS}
      --replication-factor 1
      &&
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - tickle-net
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: tickle-ai-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tickle-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tickle-ai-kafka-ui
    profiles:
      - debug
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tickle-ai-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tickle-net

  ai-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tickle-ai-worker
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_BEHAVIOR_EVENTS: ${KAFKA_TOPIC_BEHAVIOR_EVENTS}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      MODEL_PATH: ${MODEL_PATH}
      INPUT_FEATURES_PATH: ${INPUT_FEATURES_PATH}
      ALLOW_MAX_SCORE: ${ALLOW_MAX_SCORE}
      BLOCK_MIN_SCORE: ${BLOCK_MIN_SCORE}
      AI_WORKER_BATCH_SIZE: ${AI_WORKER_BATCH_SIZE}
      AI_WORKER_FLUSH_INTERVAL_SEC: ${AI_WORKER_FLUSH_INTERVAL_SEC}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - tickle-net

  ingest:
    build:
      context: ../ingest
      dockerfile: Dockerfile
    container_name: tickle-ai-ingest
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${INGEST_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_BEHAVIOR_EVENTS: ${KAFKA_TOPIC_BEHAVIOR_EVENTS}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tickle-net

networks:
  tickle-net:
    name: tickle-net

volumes:
  zookeeper-data:
    name: tickle-ai-zookeeper-data
  zookeeper-log:
    name: tickle-ai-zookeeper-log
  kafka-data:
    name: tickle-ai-kafka-data
  postgres-data:
    name: tickle-ai-postgres-data