server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ingest

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  cors:
    allowed-origins: ${INGEST_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  kafka:
    topics:
      behavior-events: ${KAFKA_TOPIC_BEHAVIOR_EVENTS:behavior-events-v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
