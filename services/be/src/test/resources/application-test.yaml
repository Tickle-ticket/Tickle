spring:
  datasource:
    url: jdbc:h2:mem:tickle-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: tickle-test-group

server:
  port: 0

internal:
  # 테스트 전용 더미 시크릿 (실제 환경변수 없이도 컨텍스트 로드 가능)
  secret: test-internal-secret

cors:
  fe-origin: http://localhost:3000
