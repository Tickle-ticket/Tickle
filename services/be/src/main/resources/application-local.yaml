spring:
  # 스프링 애플리케이션 이름
  application:
    name: tickle

  # MySQL 연결 정보
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 및 Hibernate 동작 설정
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}  # 스키마 자동 반영 전략
    open-in-view: false # View 렌더링 시점까지 영속성 컨텍스트를 열어두지 않음
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    # 실행 SQL 로그 출력 여부
    show-sql: ${JPA_SHOW_SQL}

  data:
    # Redis 연결 정보
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      # Redis 명령 타임아웃
      timeout: 3s

  # Kafka 브로커 및 컨슈머/프로듀서 설정
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      # 기본 컨슈머 그룹 ID
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # 토픽이 아직 없어도 애플리케이션 시작을 막지 않음
      missing-topics-fatal: false

server:
  # 애플리케이션 HTTP 포트
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${SERVER3_PRIVATE_IP}:4318/v1/traces

springdoc:
  # Swagger UI와 OpenAPI 문서 경로 설정
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /api-docs
