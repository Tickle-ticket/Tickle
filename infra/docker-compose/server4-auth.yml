# infra/docker-compose/server4-auth.yml
services:

  # ─── Auth Server ──────────────────────────────────
  auth:
    build:
      context: ../../services/auth
      dockerfile: Dockerfile
    container_name: tickle-auth
    restart: always
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: ${SERVER1_PRIVATE_IP}
      DB_PORT: 3306
      DB_NAME: tickle_auth
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: ${SERVER2_PRIVATE_IP}:26379,${SERVER3_PRIVATE_IP}:26379,${SERVER4_PRIVATE_IP}:26379
      REDIS_PASSWORD: ""
      SERVER_PORT: 8081
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      BE_INTERNAL_URL: http://${SERVER1_PRIVATE_IP}:8080
      COOLSMS_API_KEY: ${COOLSMS_API_KEY}
      COOLSMS_API_SECRET: ${COOLSMS_API_SECRET}
      COOLSMS_SENDER_NUMBER: ${COOLSMS_SENDER_NUMBER}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      KAKAO_SCOPE: ${KAKAO_SCOPE}
      SERVER1_PRIVATE_IP: ${SERVER1_PRIVATE_IP}
      SERVER2_PRIVATE_IP: ${SERVER2_PRIVATE_IP}
      SERVER3_PRIVATE_IP: ${SERVER3_PRIVATE_IP}
      SERVER4_PRIVATE_IP: ${SERVER4_PRIVATE_IP}
    ports:
      - "8081:8081"

  # ─── Redis Replica 2 ──────────────────────────────
  redis-replica2:
    image: redis:7
    container_name: tickle-redis-replica2
    restart: always
    mem_limit: 400m
    command: >
      redis-server
      --replicaof ${SERVER1_PRIVATE_IP} 6379
      --appendonly yes
    volumes:
      - redis-replica2-data:/data
    ports:
      - "6379:6379"

  # ─── Redis Sentinel 3 ─────────────────────────────
  redis-sentinel3:
    image: redis:7
    container_name: tickle-sentinel3
    restart: always
    mem_limit: 80m
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - sentinel3-data:/etc/redis
    ports:
      - "26379:26379"

  # ─── Promtail ─────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: tickle-promtail
    restart: always
    mem_limit: 60m
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    volumes:
      - ../../infra/promtail/promtail-server4.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis-replica2

  # ─── Node Exporter ────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: tickle-node-exporter
    restart: always
    mem_limit: 50m
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'

volumes:
  redis-replica2-data:
  sentinel3-data: