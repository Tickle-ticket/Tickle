# infra/docker-compose/server2-kafka.yml
services:

  # ─── Zookeeper ────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tickle-zookeeper
    restart: always
    mem_limit: 400m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  # ─── Kafka ────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tickle-kafka
    restart: always
    mem_limit: 1024m
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${SERVER2_PRIVATE_IP}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms256m"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ─── Redis Sentinel 1 ─────────────────────────────
  redis-sentinel1:
    image: redis:7
    container_name: tickle-sentinel1
    restart: always
    mem_limit: 80m
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - sentinel1-data:/etc/redis
    ports:
      - "26379:26379"

  # ─── Node Exporter ────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: tickle-node-exporter
    restart: always
    mem_limit: 50m
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  sentinel1-data: