# 로컬 개발 환경용 Docker Compose
# 사용법: docker compose -f infra/docker-compose/local-dev.yml up -d
# 종료:   docker compose -f infra/docker-compose/local-dev.yml down

services:

  # ─── MySQL ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: local-tickle-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tickle_core
    volumes:
      - local-mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  # ─── Redis ─────────────────────────────────────────
  redis:
    image: redis:7
    container_name: local-tickle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - local-redis-data:/data

volumes:
  local-mysql-data:
  local-redis-data:
