# 로컬 개발 환경 전용 Docker Compose
# 사용법: docker compose -f infra/docker-compose/local-dev.yml up -d
# 주의: 로컬에 설치된 MySQL(Homebrew 등)이 3306 포트를 사용 중이면 중지 후 실행하세요.

services:
  # ─── MySQL ─────────────────────────────────────────
  mysql:
    image: mysql:9.5
    container_name: tickle-mysql-local
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - local-mysql-data:/var/lib/mysql
      - ./local-init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  # ─── Redis ─────────────────────────────────────────
  redis:
    image: redis:7
    container_name: tickle-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - local-redis-data:/data

  # ─── Zookeeper (Kafka 의존성) ──────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tickle-zookeeper-local
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ─── Kafka ────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tickle-kafka-local
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  local-mysql-data:
  local-redis-data:
