<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickle Realtime Seat Monitor v2.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-primary: #38bdf8;
            --status-available: #22c55e;
            --status-held: #eab308;
            --status-confirmed: #ef4444;
            --status-unavailable: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; }
        .container { display: grid; grid-template-columns: 350px 1fr 300px; height: 100vh; }

        .sidebar { background-color: var(--card-bg); border-right: 1px solid var(--border-color); padding: 2rem; display: flex; flex-direction: column; gap: 1.2rem; overflow-y: auto; }
        .brand { font-size: 1.5rem; font-weight: 800; color: var(--brand-primary); letter-spacing: -0.05rem; }
        
        .guide-box { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 1rem; font-size: 0.85rem; line-height: 1.6; }
        .guide-box h4 { margin-bottom: 0.5rem; color: var(--brand-primary); }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
        .form-group input { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 0.6rem; color: white; font-size: 0.95rem; }

        .btn { background: var(--brand-primary); color: #000; border: none; border-radius: 8px; padding: 0.8rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.secondary { background: var(--border-color); color: white; }

        .main-content { padding: 2rem; display: flex; flex-direction: column; gap: 2rem; align-items: center; overflow-y: auto; }
        .stage-banner { width: 80%; background: #334155; padding: 0.8rem; text-align: center; border-radius: 4px 4px 40px 40px; font-weight: 800; color: var(--text-muted); }

        .seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; width: 100%; max-width: 900px; }
        .section-card { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 1rem; border: 1px solid var(--border-color); }
        .section-name { font-size: 0.8rem; font-weight: 800; color: var(--brand-primary); margin-bottom: 1rem; text-align: center; }
        .seats-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
        
        .seat { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: white; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .seat[data-status="AVAILABLE"] { background-color: var(--status-available); }
        .seat[data-status="HELD"] { background-color: var(--status-held); }
        .seat[data-status="CONFIRMED"] { background-color: var(--status-confirmed); }
        .seat[data-status="UNAVAILABLE"] { background-color: var(--status-unavailable); opacity: 0.3; }
        .seat.changed { transform: scale(1.3); z-index: 10; border: 2px solid white; }

        .inspector { background-color: var(--card-bg); border-left: 1px solid var(--border-color); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
        .legend-item { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; margin-bottom: 0.5rem; }
        .dot { width: 10px; height: 10px; border-radius: 2px; }

        .log-container { flex: 1; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 0.8rem; font-family: monospace; font-size: 0.75rem; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 0.4rem; }
        .log-entry { border-bottom: 1px solid #1e293b; padding-bottom: 0.3rem; color: #10b981; }
        .log-entry.error { color: #f43f5e; }
        .log-entry.info { color: #38bdf8; }
        .log-time { color: var(--text-muted); margin-right: 0.4rem; }

        .empty-state { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; color: var(--text-muted); text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="brand">TICKLE MONITOR</div>
            <div class="guide-box">
                <h4>🛠️ 테스트 가이드</h4>
                <ol style="padding-left: 1rem;">
                    <li><b>Server URL</b>과 <b>IDs</b>를 확인하세요.</li>
                    <li><b>[1. LOAD DATA]</b>로 좌석을 불러옵니다.</li>
                    <li><b>[2. SSE CONNECT]</b>로 스트림을 엽니다.</li>
                    <li>DB 수정 시 실시간 변화를 감상하세요!</li>
                </ol>
            </div>
            <div class="form-group"><label>Server URL</label><input id="baseUrl" type="text" value="http://localhost:8080"></div>
            <div class="form-group"><label>Event ID</label><input id="eventId" type="number" value="1"></div>
            <div class="form-group"><label>Schedule ID</label><input id="scheduleId" type="number" value="1"></div>
            <button id="loadBtn" class="btn secondary">1. LOAD SEAT DATA</button>
            <button id="connectBtn" class="btn" disabled>2. SSE CONNECT</button>
            <button id="disconnectBtn" class="btn secondary" style="display: none;">DISCONNECT</button>
        </aside>

        <main class="main-content">
            <div class="stage-banner">STAGE</div>
            <div id="seatRoot" class="seat-grid">
                <div class="empty-state">먼저 좌석 데이터를 불러와주세요.</div>
            </div>
        </main>

        <aside class="inspector">
            <div>
                <h3 style="margin-bottom: 0.8rem; font-size: 0.9rem; color: var(--brand-primary);">LEGEND</h3>
                <div class="legend">
                    <div class="legend-item"><div class="dot" style="background: var(--status-available);"></div> AVAILABLE</div>
                    <div class="legend-item"><div class="dot" style="background: var(--status-held);"></div> HELD</div>
                    <div class="legend-item"><div class="dot" style="background: var(--status-confirmed);"></div> CONFIRMED</div>
                    <div class="legend-item"><div class="dot" style="background: var(--status-unavailable);"></div> UNAVAILABLE</div>
                </div>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                <h3 style="margin-bottom: 0.8rem; font-size: 0.9rem; color: var(--brand-primary);">LIVE LOGS</h3>
                <div id="log" class="log-container"></div>
            </div>
        </aside>
    </div>

    <script>
        const els = {
            baseUrl: document.getElementById('baseUrl'),
            eventId: document.getElementById('eventId'),
            scheduleId: document.getElementById('scheduleId'),
            loadBtn: document.getElementById('loadBtn'),
            connectBtn: document.getElementById('connectBtn'),
            disconnectBtn: document.getElementById('disconnectBtn'),
            seatRoot: document.getElementById('seatRoot'),
            log: document.getElementById('log')
        };

        let eventSource = null;
        let seatData = new Map();

        function addLog(message, type = 'success') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span> ${message}`;
            els.log.prepend(entry);
        }

        els.loadBtn.onclick = async () => {
            const url = `${els.baseUrl.value.replace(/\/$/, '')}/api/v1/events/${els.eventId.value}/schedules/${els.scheduleId.value}/seats`;
            addLog(`Fetching initial seats from: ${url}`, 'info');
            
            try {
                const resp = await fetch(url);
                const result = await resp.json();
                
                if (result.data && result.data.sections) {
                    seatData.clear();
                    renderSeatMap(result.data.sections);
                    addLog(`Successfully loaded ${result.data.sections.length} sections.`);
                    els.connectBtn.disabled = false;
                } else {
                    addLog('Invalid data format received.', 'error');
                }
            } catch (e) {
                addLog(`Fetch failed: ${e.message}. Is backend running?`, 'error');
            }
        };

        function renderSeatMap(sections) {
            els.seatRoot.innerHTML = '';
            sections.forEach(section => {
                const card = document.createElement('div');
                card.className = 'section-card';
                card.innerHTML = `<div class="section-name">${section.sectionName}</div>`;
                
                const grid = document.createElement('div');
                grid.className = 'seats-container';
                
                section.seats.forEach(seat => {
                    seatData.set(seat.sessionSeatId, seat);
                    const seatEl = document.createElement('div');
                    seatEl.className = 'seat';
                    seatEl.id = `seat-${seat.sessionSeatId}`;
                    seatEl.dataset.status = seat.saleStatus;
                    seatEl.textContent = seat.seatLabel.split('-').pop();
                    seatEl.title = `${seat.seatLabel} (${seat.saleStatus})`;
                    grid.appendChild(seatEl);
                });
                card.appendChild(grid);
                els.seatRoot.appendChild(card);
            });
        }

        els.connectBtn.onclick = () => {
            const streamUrl = `${els.baseUrl.value.replace(/\/$/, '')}/api/v1/events/${els.eventId.value}/schedules/${els.scheduleId.value}/seats/stream`;
            
            if (eventSource) eventSource.close();
            addLog(`Connecting SSE: ${streamUrl}`, 'info');
            eventSource = new EventSource(streamUrl);

            eventSource.onopen = () => {
                addLog('✅ SSE Stream Connected.');
                els.connectBtn.style.display = 'none';
                els.disconnectBtn.style.display = 'block';
            };

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addLog(`Update: Seat ${data.sessionSeatId} -> ${data.newStatus}`);
                    
                    const seatEl = document.getElementById(`seat-${data.sessionSeatId}`);
                    if (seatEl) {
                        seatEl.dataset.status = data.newStatus;
                        seatEl.classList.add('changed');
                        setTimeout(() => seatEl.classList.remove('changed'), 1000);
                    }
                } catch (e) {
                    if (event.data !== 'connected') addLog(`Parse error: ${e.message}`, 'error');
                }
            };

            eventSource.onerror = () => {
                addLog('❌ SSE Connection failed.', 'error');
                eventSource.close();
                els.connectBtn.style.display = 'block';
                els.disconnectBtn.style.display = 'none';
            };
        };

        els.disconnectBtn.onclick = () => {
            if (eventSource) {
                eventSource.close();
                addLog('Disconnected.');
                els.connectBtn.style.display = 'block';
                els.disconnectBtn.style.display = 'none';
            }
        };
    </script>
</body>
</html>
